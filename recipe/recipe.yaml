schema_version: 1

context:
  name: schwifty
  version: "2026.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/schwifty-${{ version }}.tar.gz
  sha256: 45d00a54653e801d39aee09bcdb36c4106d878fe9dc2307e1a8310fea0e57c86

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.4.0
    - importlib-resources >=5.10
    - pycountry
    - rstr

tests:
  - python:
      imports:
        - schwifty
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Validate/generate IBANs and BICs
  license: MIT
  license_file: LICENSE
  homepage: http://github.com/mdomke/schwifty
  documentation: https://pythonhosted.org/schwifty/

extra:
  recipe-maintainers:
    - thewchan
