schema_version: 1

context:
  name: schwifty
  version: "2026.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/schwifty-${{ version }}.tar.gz
  sha256: 46ec749b93101b9681ac48900048da97175b69b616014df7a854ae37eadd7440

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.0.1
    - importlib-resources >=5.10
    - pycountry
    - rstr

tests:
  - python:
      imports:
        - schwifty
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Validate/generate IBANs and BICs
  license: MIT
  license_file: LICENSE
  homepage: http://github.com/mdomke/schwifty
  documentation: https://pythonhosted.org/schwifty/

extra:
  recipe-maintainers:
    - thewchan
